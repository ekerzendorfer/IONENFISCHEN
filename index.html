<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtuelles Ionenfischen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { width: 1000px; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px; }
        
        /* Header & Top Bar */
        .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        
        /* Main Layout: Lab Left, Controls Right */
        .main-layout { display: flex; gap: 24px; min-height: 400px; }
        
        /* Lab Area */
        .lab-area { flex: 1; background-color: #020617; border-radius: 8px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #334155; transition: background-color 0.3s, border-color 0.3s; padding: 20px; }
        .lab-area.light-mode { background-color: #94a3b8; border-color: #64748b; }
        
        /* Test Tube */
        .reagenzglas { width: 70px; height: 180px; border: 4px solid #64748b; border-top: none; border-radius: 0 0 35px 35px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; transition: border-color 0.3s; z-index: 10; }
        .lab-area.light-mode .reagenzglas { border-color: #334155; }
        .liquid { width: 100%; height: 0%; transition: height 0.3s ease, background-color 0.3s; position: absolute; bottom: 0; }
        .precipitate { width: 100%; height: 0%; position: absolute; bottom: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px); background-size: 8px 8px; opacity: 0; transition: opacity 0.5s, height 0.5s; z-index: 2; }
        
        /* Animations */
        .flame-anim { width: 40px; height: 60px; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); border-radius: 50% 50% 20% 20%; opacity: 0; transition: opacity 0.3s; filter: blur(4px); z-index: 5; }
        .ph-paper { width: 20px; height: 100px; background-color: #fef08a; position: absolute; top: -120px; left: 50%; transform: translateX(-50%); transition: top 0.5s ease, background-color 0.5s; z-index: 1; }
        .ph-paper.dipped { top: 20px; }

        /* Status Box */
        .status-box { width: 80%; background-color: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 12px; text-align: center; font-size: 0.9rem; margin-top: 30px; min-height: 48px; }
        .lab-area.light-mode .status-box { background-color: #f1f5f9; color: #0f172a; border-color: #cbd5e1; }

        /* Controls Area */
        .control-area { flex: 1; display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 2px solid #334155; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #94a3b8; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.2s; }
        .tab-btn:hover { color: #f8fafc; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
        
        /* Buttons */
        .action-btn { width: 100%; padding: 10px 14px; background-color: #334155; border: 1px solid #475569; border-radius: 6px; color: white; text-align: left; margin-bottom: 8px; cursor: pointer; transition: background-color 0.2s; font-size: 0.9rem; }
        .action-btn:hover { background-color: #475569; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin: 12px 0 6px 0; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Ionenfischen</h1>
            <p id="probe-label" class="text-sm text-sky-400 mt-1">Probe: PROBE_01</p>
        </div>
        <div class="text-right flex flex-col items-end gap-2">
            <div class="flex items-center gap-3">
                <span class="text-sm font-mono bg-slate-800 px-3 py-1 rounded border border-slate-700">Budget: <span id="budget">100</span> Tr.</span>
                <button onclick="glasAuswaschen(true)" class="bg-slate-600 hover:bg-slate-500 px-3 py-1 rounded text-sm transition">Auswaschen</button>
                <button onclick="neueProbe()" class="bg-sky-600 hover:bg-sky-500 px-4 py-1 rounded text-sm font-bold shadow transition">Neue Probe</button>
            </div>
            <label class="text-xs text-slate-400 cursor-pointer flex items-center gap-2 hover:text-white transition">
                <input type="checkbox" id="expert-mode" class="accent-sky-500"> Expertenmodus (keine Ionen-Namen)
            </label>
            <label class="text-xs text-slate-400 cursor-pointer flex items-center gap-2 hover:text-white transition">
                <input type="checkbox" id="light-mode-toggle" onchange="toggleLightMode()" class="accent-sky-500"> Licht an/aus
            </label>
        </div>
    </div>

    <div class="main-layout">
        <div class="lab-area" id="lab-area">
            <div class="flame-anim" id="flame"></div>
            <div class="reagenzglas" id="glas">
                <div class="ph-paper" id="ph-paper"></div>
                <div class="precipitate" id="precipitate"></div>
                <div class="liquid" id="liquid"></div>
            </div>
            <div class="status-box" id="status">System bereit. Neue Probe laden, um zu beginnen.</div>
        </div>

        <div class="control-area">
            <div class="tabs">
                <div class="tab-btn active" onclick="switchTab('vor')">Vorproben</div>
                <div class="tab-btn" onclick="switchTab('kat')">Kationen</div>
                <div class="tab-btn" onclick="switchTab('ani')">Anionen</div>
                <div class="tab-btn" onclick="switchTab('aus')">Auswertung</div>
            </div>

            <div id="tab-vor" class="tab-content">
                <button class="action-btn" onclick="checkFarbe()">Farbe der Lösung prüfen</button>
                <button class="action-btn" onclick="checkFlamme()">Flammenfärbung prüfen</button>
                <button class="action-btn" onclick="checkPH()">pH-Wert messen</button>
            </div>

            <div id="tab-kat" class="tab-content hidden">
                <div class="section-title">Säuren</div>
                <button class="action-btn" onclick="addReagent('HCl')">HCl (Salzsäure) zugeben</button>
                <button class="action-btn" onclick="addReagent('H2SO4')">H₂SO₄ (Schwefelsäure) zugeben</button>
                <div class="section-title">Basen</div>
                <button class="action-btn" onclick="addReagent('NaOH')">NaOH (Natronlauge) zugeben</button>
                <button class="action-btn" onclick="addReagent('NH3')">NH₃ (Ammoniakwasser) zugeben</button>
            </div>

            <div id="tab-ani" class="tab-content hidden">
                <button class="action-btn" onclick="addReagent('BaCl2')">BaCl₂ (Bariumchlorid) zugeben</button>
                <button class="action-btn" onclick="addReagent('AgNO3')">AgNO₃ (Silbernitrat) zugeben</button>
                <button class="action-btn" onclick="addReagent('Molybdat')">Ammoniummolybdat zugeben</button>
            </div>

            <div id="tab-aus" class="tab-content hidden">
                <div class="section-title">Ergebnis</div>
                <select id="kation-select" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white mb-3 outline-none">
                    <option value="">Kation wählen...</option>
                    <option value="Na+">Na⁺</option>
                    <option value="K+">K⁺</option>
                    <option value="Ca2+">Ca²⁺</option>
                    <option value="Ba2+">Ba²⁺</option>
                    <option value="Cu2+">Cu²⁺</option>
                    <option value="Fe2/3+">Fe²⁺ / Fe³⁺</option>
                    <option value="Ag+">Ag⁺</option>
                </select>
                <select id="anion-select" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white mb-4 outline-none">
                    <option value="">Anion wählen...</option>
                    <option value="Cl-">Cl⁻</option>
                    <option value="SO42-">SO₄²⁻</option>
                    <option value="CO32-">CO₃²⁻</option>
                    <option value="NO3-">NO₃⁻</option>
                </select>
                <button class="bg-emerald-600 hover:bg-emerald-500 w-full py-2 rounded font-bold transition" onclick="loesen()">Lösung überprüfen</button>
            </div>
        </div>
    </div>
</div>

let aktuelleProbe = null;
let budget = 100;
let isExpert = false;

function init() {
    document.getElementById('expert-mode').addEventListener('change', (e) => { isExpert = e.target.checked; });
    neueProbe();
}

function updateStatus(text) {
    document.getElementById('status').innerHTML = text;
}

function switchTab(id) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
    document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
    document.getElementById(`tab-${id}`).classList.remove('hidden');
    
    // Smarte Dropdowns bei Auswertung
    if(id === 'aus' && aktuelleProbe) {
        filterDropdowns();
    }
}

function filterDropdowns() {
    const kSelect = document.getElementById('kation-select');
    Array.from(kSelect.options).forEach(opt => {
        if(opt.value === "") return;
        // Wenn keine Flammenfärbung, dann verstecke Na/K/Ca/Ba nicht zwingend, 
        // aber man könnte Distraktoren anpassen. Wir lassen es vorerst stabil.
    });
}

function toggleLightMode() {
    const labArea = document.getElementById('lab-area');
    if (document.getElementById('light-mode-toggle').checked) {
        labArea.classList.add('light-mode');
    } else {
        labArea.classList.remove('light-mode');
    }
}

function neueProbe() {
    aktuelleProbe = salze[Math.floor(Math.random() * salze.length)];
    document.getElementById('probe-label').innerText = `Probe: PROBE_${aktuelleProbe.id.toString().padStart(2, '0')}`;
    budget = 100;
    updateBudget();
    glasAuswaschen(false);
    switchTab('vor');
    updateStatus("Neue Probe bereit. Starte mit den Vorproben.");
}

function updateBudget() {
    document.getElementById('budget').innerText = budget;
}

function checkBudget() {
    if(budget <= 0) {
        updateStatus("<span class='text-red-400'>Budget aufgebraucht! Bitte auswerten oder neue Probe anfordern.</span>");
        return false;
    }
    budget -= 1;
    updateBudget();
    return true;
}

function glasAuswaschen(manual) {
    const liquid = document.getElementById('liquid');
    const precipitate = document.getElementById('precipitate');
    document.getElementById('flame').style.opacity = 0;
    document.getElementById('ph-paper').classList.remove('dipped');
    
    liquid.style.height = '0%';
    precipitate.style.opacity = 0;
    precipitate.style.height = '0%';
    
    setTimeout(() => {
        if(aktuelleProbe) {
            liquid.style.backgroundColor = aktuelleProbe.colorCode;
            liquid.style.height = '40%';
        }
    }, 400);

    if(manual) {
        updateStatus("Glas wurde ausgewaschen. Probe im Originalzustand.");
    }
}

function checkFarbe() {
    if(!checkBudget()) return;
    updateStatus(`Die Lösung ist <b>${aktuelleProbe.farbe}</b>.`);
}

function checkFlamme() {
    if(!checkBudget()) return;
    const flame = document.getElementById('flame');
    flame.style.backgroundColor = aktuelleProbe.flammeColor;
    flame.style.opacity = 0.8;
    
    let text = aktuelleProbe.flamme === "keine" ? "Keine charakteristische Flammenfärbung." : `Die Flamme färbt sich <b>${aktuelleProbe.flamme}</b>.`;
    if(isExpert) text = "Flammenfärbung wurde durchgeführt.";
    
    updateStatus(text);
    setTimeout(() => { flame.style.opacity = 0; }, 2500);
}

function checkPH() {
    if(!checkBudget()) return;
    const paper = document.getElementById('ph-paper');
    paper.classList.add('dipped');
    
    // Farbe je nach pH approximieren
    let paperColor = "#fef08a"; // neutral gelb
    if(aktuelleProbe.ph < 4) paperColor = "#ef4444"; // rot (sauer)
    else if(aktuelleProbe.ph > 9) paperColor = "#3b82f6"; // blau (basisch)
    else if(aktuelleProbe.ph < 7) paperColor = "#f97316"; // orange
    else if(aktuelleProbe.ph > 7) paperColor = "#22c55e"; // grün
    
    setTimeout(() => { paper.style.backgroundColor = paperColor; }, 500);
    
    let text = `Der pH-Wert liegt bei ca. <b>${aktuelleProbe.ph}</b>.`;
    if(isExpert) text = "Das pH-Papier hat sich verfärbt.";
    
    updateStatus(text);
    setTimeout(() => { 
        paper.classList.remove('dipped'); 
        setTimeout(() => { paper.style.backgroundColor = "#fef08a"; }, 500);
    }, 2500);
}

function addReagent(reagent) {
    if(!checkBudget()) return;
    
    // Automatisches Auswaschen vor Zugabe (verhindert Überlagerung)
    glasAuswaschen(false);
    
    setTimeout(() => {
        let result = "";
        let hasPrecipitate = false;
        let isGas = false;

        switch(reagent) {
            case 'HCl': result = aktuelleProbe.hcl; break;
            case 'H2SO4': result = aktuelleProbe.h2so4; break;
            case 'NaOH': result = aktuelleProbe.naoh; break;
            case 'NH3': result = aktuelleProbe.nh3; break;
            case 'BaCl2': result = aktuelleProbe.bacl2; break;
            case 'AgNO3': result = aktuelleProbe.agno3; break;
            case 'Molybdat': result = (aktuelleProbe.anion === 'PO43-') ? "gelber Niederschlag" : ""; break;
        }

        if(result.includes("Niederschlag") || result.includes("Nd.")) hasPrecipitate = true;
        if(result.includes("Gasentwicklung") || result.includes("stechender Geruch") || aktuelleProbe.geruch && (reagent==='NaOH' || reagent==='HCl')) isGas = true;

        if(hasPrecipitate) {
            const prep = document.getElementById('precipitate');
            if(result.includes("weiß")) prep.style.backgroundColor = "rgba(255,255,255,0.7)";
            else if(result.includes("gelb")) prep.style.backgroundColor = "rgba(250,204,21,0.7)";
            else if(result.includes("braun")) prep.style.backgroundColor = "rgba(120,53,15,0.7)";
            else if(result.includes("blau")) prep.style.backgroundColor = "rgba(59,130,246,0.7)";
            else if(result.includes("grün")) prep.style.backgroundColor = "rgba(34,197,94,0.7)";
            else prep.style.backgroundColor = "rgba(200,200,200,0.7)";
            
            prep.style.height = "30%";
            prep.style.opacity = 1;
        }

        let outputText = result ? `Reaktion auf ${reagent}: <b>${result}</b>` : `Keine sichtbare Reaktion mit ${reagent}.`;
        
        if(isExpert) {
            outputText = result ? `Reaktion auf ${reagent} beobachtet.` : `Keine Reaktion mit ${reagent}.`;
            if(isGas) outputText += " <br><span class='text-amber-400'>(Wahrnehmung: Geruchsbildung!)</span>";
        }

        updateStatus(outputText);
    }, 600); // Warten bis ausgewaschen
}

function loesen() {
    const kSelect = document.getElementById('kation-select').value;
    const aSelect = document.getElementById('anion-select').value;
    
    if(!kSelect || !aSelect) {
        updateStatus("<span class='text-amber-400'>Bitte wähle sowohl ein Kation als auch ein Anion aus!</span>");
        return;
    }
    
    if(kSelect === aktuelleProbe.kation && aSelect === aktuelleProbe.anion) {
        updateStatus(`<span class='text-emerald-400 font-bold'>Korrekt!</span> Das Salz ist ${aktuelleProbe.name}.`);
    } else {
        updateStatus(`<span class='text-red-400 font-bold'>Leider falsch!</span> Versuch es weiter oder starte eine neue Probe.`);
    }
}

// Start
window.onload = init;
