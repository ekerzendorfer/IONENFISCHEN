<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtuelles Ionenfischen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container { width: 1000px; min-height: 850px; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
        
        /* Labor Bereich */
        .lab-area { flex: none; height: 350px; background-color: #020617; border-radius: 8px; position: relative; display: flex; align-items: flex-end; justify-content: center; border: 1px solid #334155; padding-bottom: 40px; transition: background-color 0.3s, border-color 0.3s; overflow: hidden; }
        .lab-area.light-mode { background-color: #94a3b8; border-color: #64748b; }
        
        /* Reagenzglas */
        .reagenzglas { width: 70px; height: 220px; border: 4px solid #64748b; border-top: none; border-radius: 0 0 35px 35px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10; transition: border-color 0.3s; }
        .lab-area.light-mode .reagenzglas { border-color: #334155; }
        
        /* Flüssigkeiten & Niederschläge */
        .liquid-layer { width: 100%; position: absolute; bottom: 0; border-radius: 0 0 30px 30px; transition: all 0.5s ease; z-index: 2; }
        .precipitate { width: 100%; position: absolute; bottom: 0; border-radius: 0 0 30px 30px; background-image: radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px); background-size: 8px 8px; opacity: 0; transition: opacity 0.5s, height 0.5s; z-index: 3; }
        
        /* Ringprobe Spezifisch */
        .under-layer { width: 100%; height: 0%; background-color: rgba(255,255,255,0.05); position: absolute; bottom: 0; border-radius: 0 0 30px 30px; transition: height 1s ease; z-index: 1; }
        .brown-ring { width: 100%; height: 6px; background-color: #78350f; position: absolute; bottom: 20%; opacity: 0; transition: opacity 2s ease 1s; box-shadow: 0 0 8px #78350f; z-index: 4; }

        /* Animationen: Brenner & Magnesiastäbchen */
        .burner-container { position: absolute; left: 80px; bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .burner-base { width: 20px; height: 40px; background: linear-gradient(to right, #475569, #94a3b8, #475569); border-radius: 2px; }
        .flame-anim { width: 24px; height: 45px; background-color: #3b82f6; border-radius: 50% 50% 20% 20%; filter: blur(3px); opacity: 0.8; transition: background-color 0.4s, transform 0.2s, height 0.4s; transform-origin: bottom center; animation: flicker 0.2s infinite alternate; margin-bottom: -5px; z-index: 5; }
        @keyframes flicker { 0% { transform: scaleX(0.95) scaleY(1.05); } 100% { transform: scaleX(1.05) scaleY(0.95); } }
        
        .magnesia-stick { position: absolute; left: -200px; bottom: 85px; width: 140px; height: 3px; background-color: #cbd5e1; transform: rotate(15deg); transform-origin: right center; opacity: 0; transition: all 0.8s ease; z-index: 6; }
        .magnesia-stick::after { content: ''; position: absolute; right: -4px; top: -2px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #94a3b8; }
        .magnesia-stick.active { left: -50px; opacity: 1; transform: rotate(0deg); }

        /* Animationen: pH-Papier */
        .ph-paper { width: 20px; height: 80px; background-color: #fef08a; position: absolute; top: 20px; right: 40px; opacity: 0; transition: all 0.8s ease; z-index: 10; border-radius: 2px; }
        .ph-paper.active { opacity: 1; }
        .ph-paper.dipped { top: 150px; right: calc(50% - 10px); }

        /* Animation: Dämpfe (Geruch) */
        .steam-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; z-index: 15; }
        .steam { width: 15px; height: 15px; background-color: rgba(200, 200, 200, 0.4); border-radius: 50%; position: absolute; animation: steam-rise 2s infinite; filter: blur(3px); }
        .steam:nth-child(2) { animation-delay: 0.5s; left: -10px; }
        .steam:nth-child(3) { animation-delay: 1s; left: 10px; }
        @keyframes steam-rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-50px) scale(3); opacity: 0; }
        }

        /* Dezenter Status Text */
        .status-text { text-align: center; color: #94a3b8; font-size: 1rem; min-height: 24px; margin-top: 20px; font-style: italic; }
        .lab-area.light-mode + .status-text { color: #475569; }

        /* Tabs & Controls */
        .control-area { flex: 1; display: flex; flex-direction: column; margin-top: 24px; }
        .tab-content { min-height: 220px; } 
        .tabs { display: flex; border-bottom: 2px solid #334155; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #94a3b8; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.2s; }
        .tab-btn:hover { color: #f8fafc; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
        
        .action-btn { width: 100%; padding: 10px 16px; background-color: #334155; border: 1px solid #475569; border-radius: 6px; color: white; text-align: left; margin-bottom: 8px; cursor: pointer; transition: background-color 0.2s; font-size: 0.9rem; }
        .action-btn:hover { background-color: #475569; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin: 16px 0 8px 0; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        
        .hidden { display: none !important; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-sky-400">Ionenfischen</h1>
            <p id="probe-label" class="text-sm text-slate-400 mt-1">Probe: Lade Daten...</p>
        </div>
        <div class="text-right flex flex-col items-end gap-2">
            <div class="flex items-center gap-3">
                <span class="text-sm font-mono bg-slate-800 px-3 py-1 rounded border border-slate-700">Budget: <span id="budget">100</span> Tr.</span>
                <button onclick="glasAuswaschen(true)" class="bg-slate-600 hover:bg-slate-500 px-3 py-1 rounded text-sm transition">Auswaschen</button>
                <button onclick="neueProbe()" class="bg-sky-600 hover:bg-sky-500 px-4 py-1 rounded text-sm font-bold shadow transition">Neue Probe</button>
            </div>
            <label class="text-xs text-slate-400 cursor-pointer flex items-center gap-2 hover:text-white transition">
                <input type="checkbox" id="expert-mode" class="accent-sky-500"> Expertenmodus (keine Hinweise)
            </label>
            <label class="text-xs text-slate-400 cursor-pointer flex items-center gap-2 hover:text-white transition">
                <input type="checkbox" id="light-mode-toggle" onchange="toggleLightMode()" class="accent-sky-500"> Licht an/aus
            </label>
        </div>
    </div>

    <div class="lab-area" id="lab-area">
        <div class="burner-container">
            <div class="flame-anim" id="flame"></div>
            <div class="burner-base"></div>
        </div>
        <div class="magnesia-stick" id="magnesia-stick"></div>
        <div class="ph-paper" id="ph-paper"></div>
        
        <div class="reagenzglas" id="glas">
            <div class="steam-container" id="steam">
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
            </div>
            <div class="brown-ring" id="brown-ring"></div>
            <div class="precipitate" id="precipitate"></div>
            <div class="under-layer" id="under-layer"></div>
            <div class="liquid-layer" id="liquid" style="height: 0%;"></div>
        </div>
    </div>
    
    <div class="status-text" id="status">Lade Salztabelle (salze.json)...</div>

    <div class="control-area">
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('vor')">Vorproben</div>
            <div class="tab-btn" onclick="switchTab('kat')">Kationen</div>
            <div class="tab-btn" onclick="switchTab('ani')">Anionen</div>
            <div class="tab-btn" onclick="switchTab('aus')">Auswertung</div>
        </div>

        <div id="tab-vor" class="tab-content">
            <div class="grid-2col">
                <div>
                    <div class="section-title mt-0">Standard-Tests</div>
                    <button class="action-btn" onclick="checkFarbe()">Farbe der Lösung prüfen</button>
                    <button class="action-btn" onclick="checkFlamme()">Flammenfärbung prüfen</button>
                    <button class="action-btn" onclick="checkPH()">pH-Wert messen</button>
                </div>
                <div>
                    <div class="section-title mt-0">Geruchsnachweise</div>
                    <button class="action-btn" onclick="checkGeruch('NaOH')">Erwärmen mit NaOH</button>
                    <button class="action-btn" onclick="checkGeruch('Säure')">Erwärmen mit Säure (HCl/H₂SO₄)</button>
                </div>
            </div>
        </div>

        <div id="tab-kat" class="tab-content hidden">
            <div class="grid-2col">
                <button class="action-btn" onclick="addReagent('HCl')">HCl (Salzsäure)</button>
                <button class="action-btn" onclick="addReagent('H2SO4')">H₂SO₄ (Schwefelsäure)</button>
                <button class="action-btn" onclick="addReagent('NaOH')">NaOH (Natronlauge)</button>
                <button class="action-btn" onclick="addReagent('NaOH_ue')">NaOH (im Überschuss)</button>
                <button class="action-btn" onclick="addReagent('NH3')">NH₄OH (Ammoniakwasser)</button>
                <button class="action-btn" onclick="addReagent('NH3_ue')">NH₄OH (im Überschuss)</button>
                <button class="action-btn" onclick="addReagent('Na2CO3')">Na₂CO₃ (Natriumcarbonat)</button>
                <button class="action-btn" onclick="addReagent('Na2S')">Na₂S (Natriumsulfid)</button>
            </div>
        </div>

        <div id="tab-ani" class="tab-content hidden">
            <div class="grid-2col">
                <button class="action-btn" onclick="addReagent('BaCl2')">BaCl₂ (Bariumchlorid)</button>
                <button class="action-btn" onclick="addReagent('AgNO3')">AgNO₃ (Silbernitrat)</button>
                <button class="action-btn" onclick="addReagent('Molybdat')">Ammoniummolybdat</button>
                <button class="action-btn" onclick="doRingprobe()">Ringprobe (auf Nitrat)</button>
            </div>
        </div>

        <div id="tab-aus" class="tab-content hidden">
            <div class="grid-2col mb-4">
                <div>
                    <div class="section-title mt-0">Kation ermitteln</div>
                    <select id="kation-select" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white mb-2 outline-none">
                        <option value="">Kation wählen...</option>
                        <option value="Ag+">Ag⁺</option>
                        <option value="Al3+">Al³⁺</option>
                        <option value="Ba2+">Ba²⁺</option>
                        <option value="Ca2+">Ca²⁺</option>
                        <option value="Cd2+">Cd²⁺</option>
                        <option value="Co2+">Co²⁺</option>
                        <option value="Cr3+">Cr³⁺</option>
                        <option value="Cu2+">Cu²⁺</option>
                        <option value="Fe2+">Fe²⁺</option>
                        <option value="Fe3+">Fe³⁺</option>
                        <option value="K+">K⁺</option>
                        <option value="Li+">Li⁺</option>
                        <option value="Mg2+">Mg²⁺</option>
                        <option value="Mn2+">Mn²⁺</option>
                        <option value="Na+">Na⁺</option>
                        <option value="NH4+">NH₄⁺</option>
                        <option value="Ni2+">Ni²⁺</option>
                        <option value="Pb2+">Pb²⁺</option>
                        <option value="Sr2+">Sr²⁺</option>
                        <option value="Zn2+">Zn²⁺</option>
                    </select>
                    <select id="kation-beweis" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white text-sm outline-none">
                        <option value="">Beweis Kation wählen...</option>
                        <option value="flamme">Spezifische Flammenfärbung</option>
                        <option value="nd_naoh_loest_nh3">N. mit NaOH, löst sich in NH₃ (Komplex)</option>
                        <option value="nd_naoh_loest_naoh">N. mit NaOH, löst sich im NaOH Überschuss</option>
                        <option value="nd_naoh_bleibt">Bleibender N. mit NaOH / NH₄OH</option>
                        <option value="geruch_naoh">Stechender Geruch nach Erhitzen mit NaOH</option>
                        <option value="nd_hcl_loest_nh3">Weißer N. mit HCl, löst sich in NH₃</option>
                        <option value="nd_hcl_h2so4">Weißer N. mit HCl und H₂SO₄</option>
                        <option value="ausschluss">Keine spez. Reaktion / Ausschlussverfahren</option>
                    </select>
                </div>
                <div>
                    <div class="section-title mt-0">Anion ermitteln</div>
                    <select id="anion-select" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white mb-2 outline-none">
                        <option value="">Anion wählen...</option>
                        <option value="Br-">Br⁻</option>
                        <option value="CH3COO-">CH₃COO⁻</option>
                        <option value="Cl-">Cl⁻</option>
                        <option value="CO3 2-">CO₃²⁻</option>
                        <option value="HCO3-">HCO₃⁻</option>
                        <option value="NO3-">NO₃⁻</option>
                        <option value="OH-">OH⁻</option>
                        <option value="PO4 3-">PO₄³⁻</option>
                        <option value="SO4 2-">SO₄²⁻</option>
                    </select>
                    <select id="anion-beweis" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white text-sm outline-none">
                        <option value="">Beweis Anion wählen...</option>
                        <option value="ag_weiss_nh3">Weißer N. mit AgNO₃, löst sich in NH₃</option>
                        <option value="ag_gelblich">Blassgelber/Gelblicher N. mit AgNO₃</option>
                        <option value="ba_weiss">Schwerer weißer N. mit BaCl₂</option>
                        <option value="ring">Brauner Ring (Ringprobe)</option>
                        <option value="molybdat">Gelber N. mit Ammoniummolybdat</option>
                        <option value="gas_saeure">Gasentwicklung bei Säurezugabe (HCl/H₂SO₄)</option>
                        <option value="geruch_saeure">Essiggeruch bei Säurezugabe</option>
                        <option value="stark_basisch">Stark basischer pH-Wert</option>
                        <option value="ausschluss">Ausschlussverfahren</option>
                    </select>
                </div>
            </div>
            
            <div class="section-title">Name des Salzes</div>
            <input type="text" id="salt-name" placeholder="z.B. Natriumchlorid, Eisen(III)-sulfat..." class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white mb-4 outline-none">
            
            <button class="bg-emerald-600 hover:bg-emerald-500 w-full py-3 rounded font-bold transition text-lg shadow" onclick="loesen()">Ergebnis überprüfen</button>
            <div id="auswertung-feedback" class="text-center mt-3 text-sm font-bold"></div>
        </div>
    </div>
</div>

<script>
let salze = [];
let aktuelleProbe = null;
let budget = 100;
let isExpert = false;

function init() {
    document.getElementById('expert-mode').addEventListener('change', (e) => { isExpert = e.target.checked; });
    
    // JSON laden
    fetch('salze.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('salze.json konnte nicht geladen werden.');
            }
            return response.json();
        })
        .then(data => {
            salze = data;
            if (salze.length > 0) {
                neueProbe();
            } else {
                updateStatus("Fehler: salze.json ist leer!");
            }
        })
        .catch(error => {
            console.error("Fehler beim Laden:", error);
            updateStatus("Fehler beim Laden der Datenbank (salze.json)! Lade die App über einen lokalen Webserver oder lade sie auf GitHub hoch.");
        });
}

function updateStatus(text) {
    document.getElementById('status').innerHTML = text;
}

function switchTab(id) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
    document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
    document.getElementById(`tab-${id}`).classList.remove('hidden');
}

function toggleLightMode() {
    const labArea = document.getElementById('lab-area');
    if (document.getElementById('light-mode-toggle').checked) {
        labArea.classList.add('light-mode');
    } else {
        labArea.classList.remove('light-mode');
    }
}

function neueProbe() {
    if (!salze || salze.length === 0) return;
    
    // Sortieren der Liste basierend auf probe_XX, um korrekte ID zu gewährleisten
    const randomIndex = Math.floor(Math.random() * salze.length);
    aktuelleProbe = salze[randomIndex];
    
    document.getElementById('probe-label').innerText = `Probe: ${aktuelleProbe.id.toUpperCase()}`;
    budget = 100;
    document.getElementById('budget').innerText = budget;
    
    // Reset Formulare
    document.getElementById('kation-select').value = "";
    document.getElementById('anion-select').value = "";
    document.getElementById('kation-beweis').value = "";
    document.getElementById('anion-beweis').value = "";
    document.getElementById('salt-name').value = "";
    document.getElementById('auswertung-feedback').innerHTML = "";

    glasAuswaschen(false);
    switchTab('vor');
    updateStatus("Neue Probe bereit. Starte mit den Vorproben.");
}

function checkBudget() {
    if(budget <= 0) {
        updateStatus("Budget aufgebraucht! Bitte auswerten oder neue Probe anfordern.");
        return false;
    }
    budget -= 1;
    document.getElementById('budget').innerText = budget;
    return true;
}

function parseColorFromText(text) {
    text = text.toLowerCase();
    if(text.includes('farblos')) return 'rgba(255,255,255,0.1)';
    if(text.includes('blau')) return 'rgba(56,189,248,0.4)';
    if(text.includes('grün') && text.includes('gelb')) return 'rgba(163,230,53,0.3)';
    if(text.includes('grün')) return 'rgba(74,222,128,0.4)';
    if(text.includes('rosa') || text.includes('rot')) return 'rgba(244,114,182,0.3)';
    if(text.includes('gelb') || text.includes('braun')) return 'rgba(234,179,8,0.3)';
    return 'rgba(255,255,255,0.1)';
}

function parseFlameColor(flamme) {
    if(!flamme || flamme === '-' || flamme.includes('keine')) return '#3b82f6';
    if(flamme.includes('gelb')) return '#fbbf24';
    if(flamme.includes('violett')) return '#d8b4fe';
    if(flamme.includes('rot')) return '#dc2626';
    if(flamme.includes('grün')) return '#84cc16';
    if(flamme.includes('blau')) return '#93c5fd';
    return '#3b82f6';
}

function glasAuswaschen(manual) {
    const liquid = document.getElementById('liquid');
    const precipitate = document.getElementById('precipitate');
    const underLayer = document.getElementById('under-layer');
    const brownRing = document.getElementById('brown-ring');
    const phPaper = document.getElementById('ph-paper');
    const steam = document.getElementById('steam');
    
    document.getElementById('flame').style.backgroundColor = '#3b82f6';
    document.getElementById('magnesia-stick').classList.remove('active');
    steam.style.display = 'none';
    
    // pH Papier verstecken und im unsichtbaren Zustand wieder gelb färben
    phPaper.classList.remove('active', 'dipped');
    setTimeout(() => { phPaper.style.backgroundColor = '#fef08a'; }, 600);
    
    liquid.style.height = '0%';
    precipitate.style.opacity = 0;
    precipitate.style.height = '0%';
    underLayer.style.height = '0%';
    brownRing.style.opacity = 0;
    
    setTimeout(() => {
        if(aktuelleProbe) {
            liquid.style.backgroundColor = parseColorFromText(aktuelleProbe.farbe);
            liquid.style.height = '40%';
            liquid.style.bottom = '0';
        }
    }, 400);

    if(manual) updateStatus("Glas ausgewaschen. Probe im Originalzustand.");
}

function checkFarbe() {
    if(!checkBudget()) return;
    let text = `Die Lösung ist ${aktuelleProbe.farbe}.`;
    if(isExpert) text = "Farbe wurde begutachtet.";
    updateStatus(text);
}

function checkFlamme() {
    if(!checkBudget()) return;
    const flame = document.getElementById('flame');
    const stick = document.getElementById('magnesia-stick');
    
    stick.classList.add('active');
    
    setTimeout(() => {
        flame.style.backgroundColor = parseFlameColor(aktuelleProbe.flamme);
        let text = aktuelleProbe.flamme === "-" || aktuelleProbe.flamme.includes("keine") ? "Keine charakteristische Flammenfärbung." : `Die Beobachtung ergibt: ${aktuelleProbe.flamme}.`;
        if(isExpert) text = "Flammenfärbung durchgeführt.";
        updateStatus(text);
        
        setTimeout(() => {
            flame.style.backgroundColor = '#3b82f6';
            stick.classList.remove('active');
        }, 2500);
    }, 800);
}

function checkPH() {
    if(!checkBudget()) return;
    const paper = document.getElementById('ph-paper');
    
    paper.classList.add('active');
    
    setTimeout(() => {
        paper.classList.add('dipped');
    }, 100);
    
    let paperColor = "#fef08a"; 
    let phText = "annähernd neutral (oder unauffällig)";
    
    // Sehr simpler Parser für die pH-Spalte
    if(aktuelleProbe.spezial.includes('stark basisch')) { paperColor = "#1e3a8a"; phText = "stark basisch"; }
    else if(aktuelleProbe.spezial.includes('schwach basisch')) { paperColor = "#3b82f6"; phText = "schwach basisch"; }
    
    setTimeout(() => { paper.style.backgroundColor = paperColor; }, 700);
    
    setTimeout(() => { 
        paper.classList.remove('dipped'); 
        let text = `Das pH-Papier deutet auf ein ${phText}es Milieu hin.`;
        if(isExpert) text = "pH-Papier verfärbt sich entsprechend.";
        updateStatus(text);
    }, 1500);
}

function checkGeruch(art) {
    if(!checkBudget()) return;
    glasAuswaschen(false);
    
    setTimeout(() => {
        let resultText = "Kein wahrnehmbarer Geruch.";
        let hasOdor = false;
        
        // Prüfe ob in Spezial oder in den Reagenzien ein Hinweis auf Geruch steht
        const checkStr = (aktuelleProbe.hcl + aktuelleProbe.h2so4 + aktuelleProbe.naoh + aktuelleProbe.nh3 + aktuelleProbe.spezial).toLowerCase();
        
        if (art === 'NaOH' && checkStr.includes('ammoniak')) {
            resultText = "Es steigt ein stechender Geruch auf (Ammoniak).";
            hasOdor = true;
        } else if (art === 'Säure' && (checkStr.includes('essig') || checkStr.includes('gas') || checkStr.includes('co2'))) {
            if(checkStr.includes('essig')) {
                resultText = "Es ist ein deutlicher Essiggeruch wahrnehmbar.";
            } else {
                resultText = "Es ist eine deutliche Gasentwicklung (Aufschäumen) bemerkbar.";
            }
            hasOdor = true;
        }
        
        if (hasOdor) {
            const steam = document.getElementById('steam');
            steam.style.display = 'block';
            setTimeout(() => { steam.style.display = 'none'; }, 3000);
        }
        
        if (isExpert) {
            resultText = hasOdor ? "Wahrnehmung: Gas/Geruchsbildung!" : "Keine Auffälligkeiten.";
        }
        
        updateStatus(`Erwärmen mit ${art}... ` + resultText);
    }, 600);
}

function doRingprobe() {
    if(!checkBudget()) return;
    glasAuswaschen(false);
    
    setTimeout(() => {
        updateStatus("Unterschichten mit konz. Schwefelsäure...");
        const liquid = document.getElementById('liquid');
        const underLayer = document.getElementById('under-layer');
        const brownRing = document.getElementById('brown-ring');
        
        liquid.style.bottom = '20%';
        underLayer.style.height = '20%';
        
        setTimeout(() => {
            if(aktuelleProbe.ringprobe.toLowerCase().includes('positiv')) {
                brownRing.style.opacity = 1;
                let text = "Ein brauner Ring bildet sich an der Grenzschicht aus.";
                if(isExpert) text = "Reaktion an der Grenzschicht beobachtet.";
                updateStatus(text);
            } else {
                let text = "Keine Reaktion an der Grenzschicht.";
                if(isExpert) text = "Keine Ring-Bildung beobachtet.";
                updateStatus(text);
            }
        }, 1200);
    }, 600);
}

function addReagent(reagent) {
    if(!checkBudget()) return;
    glasAuswaschen(false);
    
    setTimeout(() => {
        let result = "";
        let isGas = false;

        switch(reagent) {
            case 'HCl': result = aktuelleProbe.hcl; break;
            case 'H2SO4': result = aktuelleProbe.h2so4; break;
            case 'NaOH': result = aktuelleProbe.naoh; break;
            case 'NaOH_ue': result = aktuelleProbe.naoh_ue; break;
            case 'NH3': result = aktuelleProbe.nh3; break;
            case 'NH3_ue': result = aktuelleProbe.nh3_ue; break;
            case 'Na2CO3': result = aktuelleProbe.na2co3; break;
            case 'Na2S': result = aktuelleProbe.na2s; break;
            case 'BaCl2': result = aktuelleProbe.bacl2; break;
            case 'AgNO3': result = aktuelleProbe.agno3; break;
            case 'Molybdat': result = aktuelleProbe.molybdat; break;
        }
        
        if(!result || result === '-') result = "";

        if(result.includes("Gas") || result.includes("geruch") || result.includes("Aufschäumen")) isGas = true;

        if(result.includes("N.") || result.includes("Niederschlag")) {
            const prep = document.getElementById('precipitate');
            const resLower = result.toLowerCase();
            
            if(resLower.includes("weiß")) prep.style.backgroundColor = "rgba(255,255,255,0.7)";
            else if(resLower.includes("gelb")) prep.style.backgroundColor = "rgba(250,204,21,0.7)";
            else if(resLower.includes("braun")) prep.style.backgroundColor = "rgba(120,53,15,0.7)";
            else if(resLower.includes("blau")) prep.style.backgroundColor = "rgba(59,130,246,0.7)";
            else if(resLower.includes("grün")) prep.style.backgroundColor = "rgba(34,197,94,0.7)";
            else if(resLower.includes("schwarz")) prep.style.backgroundColor = "rgba(20,20,20,0.8)";
            else if(resLower.includes("rosa") || resLower.includes("fleisch")) prep.style.backgroundColor = "rgba(244,114,182,0.7)";
            else if(resLower.includes("violett")) prep.style.backgroundColor = "rgba(167,139,250,0.7)";
            else prep.style.backgroundColor = "rgba(200,200,200,0.7)";
            
            prep.style.height = "30%";
            prep.style.opacity = 1;
            
            // Wenn es sich löst, simuliere das
            if(resLower.includes("löst sich") || resLower.includes("löst") || resLower.includes("->")) {
                setTimeout(() => {
                    prep.style.opacity = 0;
                    prep.style.height = "0%";
                    if(resLower.includes("blau")) liquid.style.backgroundColor = "rgba(30,58,138,0.6)"; // tiefblau
                    if(resLower.includes("grün")) liquid.style.backgroundColor = "rgba(16,185,129,0.5)"; // smaragd
                    if(resLower.includes("farblos")) liquid.style.backgroundColor = "rgba(255,255,255,0.1)"; // klar
                }, 1500);
            }
        }

        let outputText = result ? result : `Keine sichtbare Reaktion.`;
        
        if(isExpert) {
            outputText = result ? `Reaktion beobachtet.` : `Keine sichtbare Reaktion.`;
            if(isGas) outputText += " (Wahrnehmung: Gas/Geruch!)";
        }

        updateStatus(outputText);
    }, 600);
}

function normalizeName(str) {
    return str.toLowerCase().replace(/[\(\)ivx\s-]/g, '');
}

function loesen() {
    const kSelect = document.getElementById('kation-select').value;
    const aSelect = document.getElementById('anion-select').value;
    const kBeweis = document.getElementById('kation-beweis').value;
    const aBeweis = document.getElementById('anion-beweis').value;
    const sName = document.getElementById('salt-name').value.trim();
    const feedback = document.getElementById('auswertung-feedback');
    
    if(!kSelect || !aSelect || !kBeweis || !aBeweis || sName === "") {
        feedback.innerHTML = "<span class='text-amber-400'>Bitte alle Felder und Beweise ausfüllen!</span>";
        return;
    }
    
    let isKationCorrect = (kSelect === aktuelleProbe.kation);
    let isAnionCorrect = (aSelect === aktuelleProbe.anion);
    
    let exactMatch = sName.toLowerCase() === aktuelleProbe.name.toLowerCase();
    let testName = normalizeName(sName);
    let refName = normalizeName(aktuelleProbe.name);
    let isNameValid = exactMatch || (testName === refName) || (refName.includes(testName) && testName.length > 5);
    
    if(isKationCorrect && isAnionCorrect && isNameValid) {
        if(exactMatch) {
            feedback.innerHTML = `<span class='text-emerald-400'>Perfekt!</span> Das Salz ist vollständig korrekt analysiert: ${aktuelleProbe.name}.`;
        } else {
            feedback.innerHTML = `<span class='text-emerald-400'>Richtig analysiert!</span> (Tipp zur genauen Schreibweise: <b>${aktuelleProbe.name}</b>)`;
        }
    } else {
        feedback.innerHTML = `<span class='text-red-400'>Leider noch nicht ganz richtig.</span> Überprüfe deine Schlüsse!`;
    }
}

window.onload = init;
</script>
